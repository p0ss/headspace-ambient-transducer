[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headspace-ambient-transducer"
version = "0.1.0"
description = "Runtime hierarchical concept monitoring for language models"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
text = ["scikit-learn>=1.3", "joblib"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "fastapi>=0.110", "uvicorn>=0.29", "httpx"]

[project.scripts]
headspace = "headspace.cli:main"

[project.urls]
Homepage = "https://github.com/p0ss/HatCat"

[tool.hatch.build.targets.wheel]
packages = ["src/headspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
